<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <rect width="1200" height="1200" fill="#F7F4F0"/>
  <!-- OG card occupies the centre 1200x630 band; the square canvas only exists
       so the renderer keeps a 1:1 scale, and is cropped away afterwards. -->
  <g transform="translate(0,285)">
    <rect x="0" y="0" width="1200" height="10" fill="#9C6B4F"/>

    <g transform="translate(96, 143) scale(0.673)">
      <circle cx="256" cy="256" r="256" fill="#9C6B4F"/>
      <circle cx="168" cy="168" r="30" fill="none" stroke="#F7F4F0" stroke-width="14" opacity=".9"/>
      <rect x="224" y="154" width="150" height="26" rx="13" fill="#F7F4F0" opacity=".55"/>
      <circle cx="168" cy="256" r="30" fill="none" stroke="#F7F4F0" stroke-width="14"/>
      <path d="M168 226 A30 30 0 0 1 168 286 Z" fill="#F7F4F0"/>
      <rect x="224" y="242" width="180" height="26" rx="13" fill="#F7F4F0" opacity=".8"/>
      <circle cx="168" cy="344" r="36" fill="#F7F4F0"/>
      <path d="M152 344 l12 13 l22 -25" fill="none" stroke="#9C6B4F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="224" y="330" width="120" height="26" rx="13" fill="#F7F4F0"/>
    </g>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="510" y="250" font-size="96" font-weight="700" fill="#3B332C" letter-spacing="-2">TODODO</text>
      <text x="510" y="322" font-size="40" font-weight="500" fill="#7A6E63">Your day, one list at a time.</text>
      <rect x="512" y="366" width="96" height="5" rx="2.5" fill="#9C6B4F"/>
      <text x="510" y="432" font-size="27" font-weight="600" fill="#9C6B4F" letter-spacing="1.5">TELEGRAM MINI APP</text>
      <text x="510" y="480" font-size="25" font-weight="400" fill="#7A6E63">No install · No signup · Encrypted tasks</text>
    </g>
  </g>
</svg>
